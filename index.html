    <style>
      body {
        margin: 0;
        background-image: linear-gradient(to bottom right, #011206, #1c542c);
        background-attachment: fixed;
        min-height: 100vh;
      }

      .container {
        width: 100%;
        position: relative;
      }

      .background {
        position: absolute;
        top: 0;
        bottom: 0;
        margin-bottom: 3%;
        margin-left: -18%;
        width: 100%;
        opacity: 0.33;
      }

      .background img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: left bottom;
      }

      .content {
        width: 960px;
        max-width: 100%;
        margin: auto;
        padding: 0 120px;
        position: relative;
      }

      .logo-container {
        position: relative;
        width: 1200px;
        max-width: 100%;
        margin: -30px auto 0;
      }

      .logo {
        display: block;
        width: 100%;
        height: auto;
      }

      h1 {
        font-family: "Alegreya SC", serif;
        font-size: 2em;
        color: #FF0000;
        margin-left: 10%;
        margin-top: 10%;
        text-shadow: 0px 0px 5px #000000;
      }

      h2 {
        position: absolute;
        margin-top: -15%;
        margin-left: 55%;
        font-family: "Alegreya SC", serif;
        color: #FF0000;
        font-size: 2em;
        text-shadow: 0px 0px 5px #000000;
      }

      p {
        font-family: "Alegreya SC", serif;
        color: #FF0000;
        font-size: 1.75em;
        width: 100%;
        margin: 0;
        margin-top: 120px;
        text-shadow: 0px 0px 6px #000000;
      }

      .box {
        width: 100%;
        margin-top: 240px;
      }

      .box img {
        display: block;
        width: 100%;
        height: auto;
        position: relative;
      }

      .zagreus {
        display: block;
        width: 300px;
        height: 750px;
        margin-top: auto;
        object-fit: cover;
        object-position: left bottom;
      }
      
      .button-container {
        background-color: #000000;
        width: 100%;
        margin: -2.5% 0 0;
        padding-top: 6%;
        min-height: 750px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .buttons {
        list-style: none;
        margin: 0 50px 4% 120px;
        padding: 0;
        max-width: 960px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-auto-rows: 1fr;
        gap: 20px;
      }

      .buttons li {
        display: grid;
      }

      .buttons a {
        display: grid;
        align-content: center;
        padding: 10px;
        font-family: "Alegreya SC", serif;
        font-size: 2em;
        text-align: center;
        text-decoration: none;
        word-break: break-all;
        color: #FF0000;
        background-color: #011206;
        border: 2px solid #FF0000;
        border-radius: 5px;
        transition: color 0.5s, background-color 0.5s;
      }

      .buttons a:hover, .buttons a:focus {
        color: #000000;
        background-color: #FF0000;
      }
      
      @media (max-width: 1200px) {
        .content {
          width: 80%;
          padding: 0;
        }

        .buttons {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      
    </style>
  </head>

  <body>
    <div class="container">

      <div class="background">
  <img src="Hades_Character.png" alt="BG Character">
</div>
      
      <div class="content">

        <h1>A beginner's guide to</h1>

        <div class="logo-container">
          <img class="logo" src="Hades_logo.png" alt="Title Card">
          <h2>By Supergiant Games</h2>
        </div>

        <p>
          “Defy the god of the dead as you hack and slash out of the Underworld in this rogue-like dungeon crawler from the creators of Bastion, Transistor, and Pyre.”
        </p>
      </div>

      <div class="box">
        <img src="Container-Top.png" alt="Buttons container top">
      </div>
    </div>
      
      <div class="button-container">
        <div class="button-container">

        <ul class="buttons">
          <li><a href="characters.html">Characters</a></li>
          <li><a href="gameplay.html">Gameplay</a></li>
          <li><a href="story.html">Story</a></li>
          <li><a href="locations.html">Locations</a></li>
          <li><a href="bosses.html">Bosses</a></li>
          <li><a href="items.html">Items</a></li>
        </ul>

        <img class="zagreus" src="Zagreus.png" alt="Button container deco">

      </div>
    </div>
  </body>
