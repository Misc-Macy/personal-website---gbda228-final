
<!DOCTYPE html>
<html lang="en-CA">
  <head>
    <title>GBDA228 Final Project - Personal Website</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya+SC&display=swap" rel="stylesheet">

    <style>
      body {
        margin: 0;
        background-image: linear-gradient(to bottom right, #011206, #1c542c);
        background-attachment: fixed;
        min-height: 100vh;
      }

      .container {
        width: 100%;
        position: relative;
      }

      .background {
        position: absolute;
        margin-left: -350px;
        margin-top: -160px;
        opacity: 0.33;
      }

      .content {
        width: 960px;
        max-width: 100%;
        margin: auto;
        padding: 0 120px;
        position: relative;
      }

      .logo-container {
        position: relative;
        width: 1200px;
        max-width: 100%;
        margin: -30px auto 0;
      }

      .logo {
        display: block;
        width: 100%;
        height: auto;
      }

      h1 {
        font-family: "Alegreya SC", serif;
        font-size: 2em;
        color: #FF0000;
        margin-left: 10%;
        margin-top: 10%;
        text-shadow: 0px 0px 5px #000000;
      }

      h2 {
        position: absolute;
        margin-top: -15%;
        margin-left: 55%;
        font-family: "Alegreya SC", serif;
        color: #FF0000;
        font-size: 2em;
        text-shadow: 0px 0px 5px #000000;
      }

      p {
        font-family: "Alegreya SC", serif;
        color: #FF0000;
        font-size: 1.75em;
        width: 100%;
        margin: 0;
        margin-top: 120px;
        text-shadow: 0px 0px 6px #000000;
      }

      .box {
        width: 100%;
        margin-top: 240px;
      }

      .box img {
        display: block;
        width: 100%;
        height: auto;
        position: relative;
      }

      .button-container {
        background-color: #000000;
        width: 100%;
        min-height: 1000px;
        margin: -2.5% 0 0;
      }
      
      @media (max-width: 1200px) {
        .content {
          width: 80%;
          padding: 0;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">

      <img class="background" src="Hades_Character.png" alt="BG Character">
      
      <div class="content">

        <h1>A deep dive into the world of</h1>

        <div class="logo-container">
          <img class="logo" src="Hades_logo.png" alt="Title Card">
          <h2>By Supergiant Games</h2>
        </div>

        <p>
          “Defy the god of the dead as you hack and slash out of the Underworld in this rogue-like dungeon crawler from the creators of Bastion, Transistor, and Pyre.”
        </p>

      </div>

      <div class="box">
        <img src="Container-Top.png" alt="Buttons container top">
      </div>

      <div class="button-container">
        <!-- Your six buttons go here -->
      </div>

    </div>
  </body>
</html>
